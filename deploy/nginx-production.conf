server {
    listen 80;
    listen 443 ssl http2;
    server_name nurverse.id www.nurverse.id;
    
    # SSL Configuration (placeholders - update with actual certs)
    ssl_certificate /path/to/ssl/certificate.crt;
    ssl_certificate_key /path/to/ssl/private.key;
    
    # Redirect HTTP to HTTPS
    if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }
    
    # Root for frontend
    root /www/wwwroot/nurverse.id/manajemen-annur/frontend/dist;
    index index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # File uploads size limit
    client_max_body_size 50M;
    
    # API Routes - Route to Laravel Backend
    location /api/ {
        # Remove /api prefix and pass to Laravel public/index.php
        rewrite ^/api/(.*)$ /index.php/$1 break;
        
        # FastCGI config for PHP-FPM
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/nurverse.id/manajemen-annur/backend/public/index.php;
        fastcgi_param REQUEST_URI /api/$1;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param PATH_INFO /$1;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    
    # Storage symlink for file access
    location /storage/ {
        alias /www/wwwroot/nurverse.id/manajemen-annur/backend/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Frontend SPA - serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }
    
    location ~ /\.env {
        deny all;
    }
    
    location ~ /composer\.(json|lock)$ {
        deny all;
    }
    
    location ~ /package\.(json|lock)$ {
        deny all;
    }
}
